<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMODINÁMICA S1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>CALCULADORA SUS</h1>
        <label for="velocidad">Ingrese la viscosidad (mm^2/s):</label>
        <input type="number" id="velocidad">
        <label for="temperatura">Selecciona una temperatura (t° F):</label>
        <select id="temperatura">
            <option value="100">100</option>
            <option value="210">210</option>
        </select>
                
        <button onclick="calcularSUS()">Calcular</button>

        <h2 id="resultado"></h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
